<!DOCTYPE html>
<html><head><meta name="viewport" content="width=device-width,initial-scale=1">
<style>body{background:#0a0a0a;color:#fff;font-family:Arial;margin:0;padding:12px}.header{color:#4cff4c;font-weight:bold;text-align:center;font-size:18px;margin:10px}.card{background:#1a1a1a;border:1px solid #4cff4c55;border-radius:12px;padding:12px;margin-bottom:10px}.match{display:flex;align-items:center;justify-content:space-between;background:#222;border:1px solid #4cff4c33;border-radius:10px;padding:10px;margin:8px 0}.match img{width:40px;height:40px}.cote{background:#4cff4c;color:#000;font-weight:bold;padding:10px 15px;border-radius:8px;font-size:18px}.btn{width:100%;padding:14px;font-weight:bold;border:none;border-radius:8px;margin:5px 0;font-size:16px}.yellow{background:#ffeb3b}.green{background:#0a7a0a;color:#fff}.red{background:#7a0a0a;color:#fff}.mise-row{display:flex;gap:8px;align-items:center}</style></head><body>
<div class="header">BOSS COMBINE V8 PRO EUROPE</div>
<div class="card" id="ticket">Chargement...</div>
<div class="card"><div class="mise-row"><span>Mise: <b id="mise">500 FCFA</b></span><button class="btn green" style="width:30%" onclick="changeMise(500)">+500</button><button class="btn red" style="width:30%" onclick="changeMise(-500)">-500</button></div><div style="margin-top:10px;color:#4cff4c;font-weight:bold" id="gain">COTE 9.86 | GAIN 4928 FCFA</div></div>
<button class="btn yellow" onclick="load()">🔥 GENERER COMBINE EUROPE (7 JOURS)</button><div id="list"></div>
<script>let mise=500,cote=9.86;function changeMise(v){if(mise+v>=500){mise+=v;document.getElementById('mise').innerText=mise+' FCFA';document.getElementById('gain').innerText=`COTE ${cote} | GAIN ${Math.round(cote*mise)} FCFA`;}}async function load(){document.getElementById('ticket').innerText='Scan Serie A, Bundesliga, PL, UCL...';let r=await fetch('/api/combine');let d=await r.json();cote=d.cote_tot;let txt='';d.matches.forEach((m,i)=>{txt+=`${i+1}. ${m.home} vs ${m.away} (${m.league}) @ ${m.cote}<br>`});document.getElementById('ticket').innerHTML=txt;document.getElementById('gain').innerText=`COTE ${cote} | GAIN ${Math.round(cote*mise)} FCFA`;let html='';d.matches.forEach(m=>{html+=`<div class=match><img src=${m.logo_h}><div><b>${m.home} vs ${m.away}</b><br><small style=color:#4cff4c>${m.league} - ${m.winner}</small></div><img src=${m.logo_a}><div class=cote>${m.cote}</div></div>`;});document.getElementById('list').innerHTML=html;}load();</script></body></html>
